# =====================================================================================
# CATÁLOGO DE VERSIONES (Version Catalog de Gradle)
# -------------------------------------------------------------------------------------
# Centraliza en UN SOLO archivo todas las versiones de plugins y librerías del proyecto.
# Las versiones están ALINEADAS con el proyecto de ejemplo de la cátedra
# (github.com/hugoguarneri/ort-tp3-simulacro-parcial) para asegurar que compile igual en
# las máquinas de los 3 integrantes y del docente.
# En los build.gradle.kts se referencian como libs.<alias> y libs.plugins.<alias>.
# =====================================================================================

[versions]
# Android Gradle Plugin 9.x: trae Kotlin "built-in" (ya no se aplica el plugin kotlin-android).
agp = "9.1.1"
# Versión de Kotlin (la misma que usa AGP 9.1 internamente).
kotlin = "2.2.10"
# KSP (Kotlin Symbol Processing): procesador de anotaciones de Room y Hilt (reemplaza a kapt).
ksp = "2.3.5"
# Hilt: framework de inyección de dependencias construido SOBRE Dagger.
hilt = "2.59.2"
# Integración de Hilt con Navigation/ViewModels de Compose (función hiltViewModel()).
hiltNavigationCompose = "1.3.0"
coreKtx = "1.17.0"
lifecycle = "2.10.0"
activityCompose = "1.12.4"
# BOM (Bill of Materials) de Compose: fija versiones compatibles entre todas las libs de Compose.
composeBom = "2026.03.01"
navigationCompose = "2.9.7"
# Retrofit 3 + Gson: cliente HTTP declarativo y conversión JSON <-> objetos Kotlin.
retrofit = "3.0.0"
# OkHttp: motor HTTP de Retrofit (interceptores de logging y de headers del mock).
okhttp = "4.12.0"
# Room: ORM oficial de Android sobre SQLite (caché offline de entrenamientos y comidas).
room = "2.8.4"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose (las versiones las decide el BOM, por eso no llevan version.ref)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Íconos extendidos (campana, calendario, micrófono, pesas...) usados en el diseño de Figma.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt / Dagger
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Retrofit / OkHttp / Gson
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Tests
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Plugin del compilador de Compose (obligatorio desde Kotlin 2.0).
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
