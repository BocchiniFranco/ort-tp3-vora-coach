# =====================================================================================
# api.properties - Servidor de la API que usa la app (RF01, RF02, RF05)
# Se sube al repo: todo el equipo compila contra el mismo servidor.
# La URL elegida llega al código como BuildConfig.BASE_URL (ver app/build.gradle.kts).
# Después de cambiar algo: File > Sync Project with Gradle Files y volver a ejecutar la app.
# =====================================================================================

# Servidor que usa la app:
#   mock -> mock local de la cátedra (python3 server.py), en vora.mockBaseUrl
#   api  -> servidor publicado de la cátedra, en vora.apiBaseUrl
vora.server=mock

# Mock local. Debe terminar en "/".
#   Emulador ........................ http://10.0.2.2:8000/
#       (10.0.2.2 es la IP con la que el emulador ve el "localhost" de la PC)
#   Teléfono por USB con adb reverse . http://localhost:8000/
#       (antes ejecutar en la PC: adb reverse tcp:8000 tcp:8000)
#   Teléfono por Wi-Fi .............. http://<IP-de-la-PC>:8000/
#       (levantar el mock con --host 0.0.0.0 y permitirlo en el firewall)
vora.mockBaseUrl=http://10.0.2.2:8000/

# Servidor publicado de la cátedra. Debe terminar en "/".
vora.apiBaseUrl=https://tp3.martinrivas.ar/
