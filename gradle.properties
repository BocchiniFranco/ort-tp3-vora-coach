# =====================================================================================
# gradle.properties - Configuración global de Gradle para el proyecto VORA Coach
# =====================================================================================

# Memoria máxima para el proceso de Gradle (Compose + Room + Hilt necesitan bastante).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Compila módulos en paralelo y reutiliza resultados de compilaciones anteriores.
org.gradle.parallel=true
org.gradle.caching=true

# Usa las librerías AndroidX (obligatorio en proyectos modernos).
android.useAndroidX=true

# Estilo de código oficial de Kotlin.
kotlin.code.style=official

# Genera la clase R solo con los recursos propios del módulo (builds más rápidos).
android.nonTransitiveRClass=true

# -------------------------------------------------------------------------------------
# SERVIDOR MOCK (RF01, RF02, RF05)
# vora.useLocalMock
#   false -> usa el servidor publicado: https://tp3.martinrivas.ar/
#   true  -> usa el mock local de la cátedra (server.py), en la URL de vora.localMockUrl
#
# vora.localMockUrl (solo se usa si vora.useLocalMock=true). Debe terminar en "/".
#   Emulador ........................ http://10.0.2.2:8000/
#       (10.0.2.2 es la IP con la que el emulador ve el "localhost" de la PC)
#   Teléfono por USB con adb reverse . http://localhost:8000/
#       (antes ejecutar en la PC: adb reverse tcp:8000 tcp:8000)
#   Teléfono por Wi-Fi .............. http://<IP-de-la-PC>:8000/
#       (levantar el mock con --host 0.0.0.0 y permitirlo en el firewall)
#
# Después de cambiar algo: File > Sync Project with Gradle Files y volver a ejecutar la app.
# -------------------------------------------------------------------------------------
vora.useLocalMock=false
vora.localMockUrl=http://10.0.2.2:8000/

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
