# =====================================================================================
# gradle.properties - Configuración global de Gradle para el proyecto VORA Coach
# =====================================================================================

# Memoria máxima para el proceso de Gradle (Compose + Room + Hilt necesitan bastante).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Compila módulos en paralelo y reutiliza resultados de compilaciones anteriores.
org.gradle.parallel=true
org.gradle.caching=true

# Usa las librerías AndroidX (obligatorio en proyectos modernos).
android.useAndroidX=true

# Estilo de código oficial de Kotlin.
kotlin.code.style=official

# Genera la clase R solo con los recursos propios del módulo (builds más rápidos).
android.nonTransitiveRClass=true

# El servidor de la API (mock local o cátedra) se elige en api.properties.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
